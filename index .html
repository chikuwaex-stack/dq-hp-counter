const B={hd1:[multi('カンダタ一味',[['カンダタ①',176],['カンダタこぶん②',85]]),b('ようじゅつし',363),multi('よろいのきし＆かげのきし',[['よろいのきし①',105],['かげのきし②',92],['かげのきし③',92]]),b('ドラゴン',2240),b('ダークドリーマー',226),b('ゴーレム',2070),b('ドラゴンゾンビ',560),b('エイリアンフライ',1988,{skills:[partyHeal('ベホマラー',85)]}),b('マーダーゴイル',2408),b('エクソダス',2556),b('りゅうおう',3140),b('竜王',4800,{skills:[partyHeal('ベホマラー',85)]})],dq1:[b('ドラゴン',153),b('ゴーレム',155),b('あくまのきし',79),b('りゅうおう（第1形態）',240,{skills:[heal('ベホイミ',85)]}),b('りゅうおう（第2形態）',350)],dq2:[b('あくましんかん',180),b('アトラス',250),b('バズズ',250,{skills:[full('ベホマ')]}),b('ベリアル',320,{skills:[full('ベホマ')]}),b('ハーゴン',460,{skills:[heal('ベホイミ',85)]}),b('シドー',1750)],dq3:[multi('カンダタ一味（1回目）',[['カンダタ①',300],['カンダタこぶん②',60],['カンダタこぶん③',60],['カンダタこぶん④',60]]),multi('カンダタ一味（2回目）',[['カンダタ①',700],['カンダタこぶん②',120],['カンダタこぶん③',120]]),b('やまたのおろち（1回目）',1800),b('やまたのおろち（2回目）',2000),b('ボストロール',1500),b('バラモス',2500,{regen:100}),b('キングヒドラ',1600),b('バラモスブロス',1100),b('バラモスゾンビ',3000,{regen:50}),b('ゾーマ（闇の衣）',4500,{regen:100}),b('ゾーマ（光の玉使用後）',4700),b('しんりゅう',7300)],dq4:[multi('ピサロのてさき＋おおめだま',[['ピサロのてさき①',250],['おおめだま②',42]]),b('ミスターハン（2章）',70),b('ラゴス（2章）',90),b('ビビアン（2章）',90,{skills:[heal('ベホイミ',85)]}),b('サイモン（2章）',90,{skills:[heal('やくそう',35)]}),b('ベロリンマン（2章）',55),b('バルザック（4章）',300,{regen:20,skills:[full('ベホマ')]}),b('キングレオ（5章）',950,{regen:50}),b('バルザック＋',500,{regen:50}),b('エスターク',2700,{regen:100}),multi('アンドレアル×3',[['アンドレアル①',300],['アンドレアル②',300],['アンドレアル③',300]]),b('ギガデーモン',2000,{regen:100}),b('エビルプリースト',1500,{regen:50}),b('ヘルバトラー',3000,{regen:50}),b('デスピサロ 第1形態',800),b('デスピサロ 第2形態',650),b('デスピサロ 第3形態',1023),b('デスピサロ 第4形態',700,{skills:[heal('めいそう',500)]}),b('デスピサロ 第5形態',800),b('デスピサロ 第6形態',700),b('デスピサロ 最終形態',1023)],dq5s:[b('おやぶんゴースト',200),b('ゆきのじょおう',600,{skills:[heal('ホイミ',35)]}),b('ゲマ（幼年期）',1024,{regen:100}),b('ニセたいこう',350),multi('ようがんげんじん×3',[['ようがんげんじん①',400],['ようがんげんじん②',400],['ようがんげんじん③',400]]),b('カンダタ',600,{skills:[heal('ベホイミ',85)]}),b('ジャミ（バリア）',2000,{regen:100}),b('ブオーン',4500),b('ゴンズ',1700),b('ゲマ（ボブルの塔）',4500),b('イブール',4500),b('ミルドラース 第1形態',1600,{regen:50}),b('ミルドラース 第2形態',4500,{skills:[heal('めいそう',500)]}),b('エスターク',9000)],dq5p:[b('おやぶんゴースト',200),b('ゆきのじょおう',550,{skills:[heal('ホイミ',35)]}),b('ニセたいこう',650),b('カンダタ',1400,{skills:[heal('ベホイミ',85)]}),b('ジャミ',1000),b('ブオーン',4500),b('ゴンズ',2400),b('ゲマ（ボブルの塔）',4500),b('ラマダ',3500),b('イブール',4200),b('ゲマ（エビルマウンテン）',3800),b('ミルドラース 第1形態',1800),b('ミルドラース 第2形態',6000),b('エスターク',9000)],dq6:[b('とうのへいたい',150),multi('ポイズンゾンビ×3',[['ポイズンゾンビ①',360],['ポイズンゾンビ②',360],['ポイズンゾンビ③',360]]),b('ムドー（幻）',900),b('ムドー城 1戦目',500,{regen:20}),b('ムドー城 2戦目',900),b('ジャミラス',1500),b('ミラルゴ',2400),b('グラコス',3000),b('ヘルクラウド',3000),multi('キラーマジンガ＋ランドアーマー',[['キラーマジンガ①',600],['ランドアーマー②',410]]),b('テリー',2500),b('デュラン',3000),b('アクバー',3300),b('デスタムーア 第1形態',2000,{skills:[heal('めいそう',500)]}),b('デスタムーア 第2形態',3000),multi('デスタムーア 第3形態',[['本体①',2500],['右手②',1700],['左手③',2000]],{skills:[partyHeal('ベホマラー',85),revive('ザオラル',.5),revive('ザオリク',1)]}),b('ダークドレアム',13000)]};
function b(name,hp,opt={}){return{name,hp,...opt}}function multi(name,enemies,opt={}){return{name,hp:enemies[0][1],enemies,...opt}}function heal(name,value){return{type:'heal',name,value}}function full(name){return{type:'full',name}}function partyHeal(name,value){return{type:'partyHeal',name,value}}function revive(name,rate){return{type:'revive',name,rate}}
const S={work:'hd1',boss:null,max:0,initial:0,hp:0,parts:[],target:0,log:[],listening:false,recognition:null,manualInitial:false,keyMode:'single'};
function init(){Object.entries(W).forEach(([v,t])=>ui.work.add(new Option(t,v)));ui.work.onchange=loadBosses;ui.boss.onchange=selectBoss;ui.max.oninput=()=>{if(!S.manualInitial)ui.initial.value=ui.max.value};ui.initial.oninput=()=>S.manualInitial=true;$('start').onclick=start;$('reset').onclick=reset;$('undo').onclick=undo;ui.back.onclick=back;ui.keyOpen.onclick=()=>openKey('single');ui.allOpen.onclick=()=>openKey('all');ui.turn.onclick=endTurn;ui.mic.onclick=toggleMic;$('keyClose').onclick=closeKey;$('keyClear').onclick=()=>ui.keyDisplay.value='';$('keyBack').onclick=()=>ui.keyDisplay.value=ui.keyDisplay.value.slice(0,-1);$('keyDamage').onclick=()=>submitKey(false);$('keyHeal').onclick=()=>submitKey(true);document.querySelectorAll('[data-key]').forEach(x=>x.onclick=()=>{if(ui.keyDisplay.value.length<5)ui.keyDisplay.value+=x.dataset.key});ui.keyModal.onclick=e=>{if(e.target===ui.keyModal)closeKey()};loadBosses();setupSpeech()}
function loadBosses(){S.work=ui.work.value;ui.boss.innerHTML='';if(S.work==='custom'){ui.boss.disabled=true;ui.name.readOnly=false;ui.name.value='ボス';ui.max.value=ui.initial.value=250;S.manualInitial=false;return}ui.boss.disabled=false;ui.name.readOnly=true;B[S.work].forEach((x,i)=>ui.boss.add(new Option(x.name,i)));selectBoss()}
function selectBoss(){if(S.work==='custom')return;S.boss=B[S.work][+ui.boss.value];ui.name.value=S.boss.name;ui.max.value=ui.initial.value=S.boss.hp;S.manualInitial=false}
function start(){let max=Math.trunc(+ui.max.value),initial=Math.trunc(+ui.initial.value);if(!Number.isFinite(max)||max<1){notice('最大HPを確認してください');return}initial=Math.max(0,Math.min(max,initial));if(S.work==='custom')S.boss=b(ui.name.value||'ボス',max);S.max=max;S.initial=initial;S.hp=initial;S.log=[];S.target=0;if(S.boss.enemies)S.parts=S.boss.enemies.map(([name,hp],i)=>({slot:'ABCD'[i],name,max:hp,hp}));else S.parts=[];ui.title.textContent=S.boss.name;showBattle(true);render()}
function showBattle(on){ui.setup.hidden=on;[ui.battle,ui.hpbox,ui.stats,ui.heard,ui.mic,ui.actions,ui.controls,ui.history,ui.back].forEach(x=>x.hidden=!on);ui.multi.hidden=!(on&&S.parts.length);ui.allOpen.hidden=!(on&&S.parts.length);document.body.classList.toggle('multiMode',!!(on&&S.parts.length));renderParts();renderSkills()}
function current(){return S.parts.length?S.parts[S.target]:{hp:S.hp,max:S.max,name:S.boss.name}}
function apply(value,target=S.target){if(!Number.isFinite(value)||value===0)return;if(S.parts.length){const p=S.parts[target],before=p.hp;p.hp=value>0?Math.max(0,p.hp-value):Math.min(p.max,p.hp+Math.abs(value));S.log.push({type:'single',target,value,before,after:p.hp});S.target=target}else{const before=S.hp;S.hp=value>0?Math.max(0,S.hp-value):Math.min(S.max,S.hp+Math.abs(value));S.log.push({type:'single',value,before,after:S.hp})}ui.heard.textContent=value>0?'−'+value:'＋'+Math.abs(value);render()}
function applyAll(value){if(!S.parts.length)return;const before=S.parts.map(p=>p.hp);S.parts.forEach(p=>{if(p.hp>0)p.hp=Math.max(0,p.hp-value)});S.log.push({type:'allDamage',value,before});ui.heard.textContent='全体 −'+value;render()}
function endTurn(){const n=S.boss.regen||0;if(!n)return;if(S.parts.length)return;const before=S.hp;S.hp=Math.min(S.max,S.hp+n);S.log.push({type:'regen',value:n,before,after:S.hp});ui.heard.textContent='＋'+n;render()}
function useSkill(sk){if(sk.type==='heal')return apply(-sk.value);if(sk.type==='full'){const p=current();return apply(-(p.max-p.hp))}if(sk.type==='partyHeal'){const before=S.parts.map(p=>p.hp);S.parts.forEach(p=>{if(p.hp>0)p.hp=Math.min(p.max,p.hp+sk.value)});S.log.push({type:'partyHeal',value:sk.value,before});render()}if(sk.type==='revive'){const p=S.parts[S.target];if(p.hp>0){notice('HP0の対象を選んでください');return}const before=p.hp;p.hp=sk.rate===1?p.max:Math.floor(p.max*sk.rate);S.log.push({type:'revive',target:S.target,before,after:p.hp,name:sk.name});render()}}
function undo(){const x=S.log.pop();if(!x){notice('取り消せる入力がありません');return}if(x.type==='single'){if(S.parts.length){S.parts[x.target].hp=x.before;S.target=x.target}else S.hp=x.before}else if(x.type==='allDamage'||x.type==='partyHeal')S.parts.forEach((p,i)=>p.hp=x.before[i]);else if(x.type==='regen')S.hp=x.before;else if(x.type==='revive'){S.parts[x.target].hp=x.before;S.target=x.target}ui.heard.textContent='↩ 取消';render();openKey('single')}
function reset(){S.log=[];if(S.parts.length)S.parts=S.boss.enemies.map(([name,hp],i)=>({slot:'ABCD'[i],name,max:hp,hp}));else S.hp=S.initial;render()}
function render(){const p=current(),ratio=Math.max(0,Math.min(1,p.hp/p.max));ui.hp.textContent=p.hp;ui.maxView.textContent=p.max;ui.bar.style.width=ratio*100+'%';ui.bar.style.background=ratio<=.2?'var(--red)':ratio<=.5?'var(--yellow)':'var(--green)';ui.hp.className='hp'+(ratio<=.2?' danger':ratio<=.5?' warn':'');ui.total.textContent=S.log.reduce((a,x)=>a+(x.type==='single'&&x.value>0?x.value:x.type==='allDamage'?x.value:0),0);ui.warn.hidden=!(S.work==='dq5s'&&p.hp===2047);ui.turn.hidden=!S.boss.regen;ui.turn.textContent=S.boss.regen?'⟳ ターン終了 ＋'+S.boss.regen+'回復':'⟳ ターン終了';renderParts();renderHistory();renderSkills()}
function renderParts(){ui.partGrid.innerHTML='';if(!S.parts.length)return;S.parts.forEach((p,i)=>{const bt=document.createElement('button');bt.className='part'+(i===S.target?' active':'')+(p.hp<=0?' dead':'');bt.innerHTML='<span class="badge">'+p.slot+'</span>'+p.name+'<b>'+p.hp+'</b>';bt.onclick=()=>{S.target=i;render()};ui.partGrid.appendChild(bt)})}
function renderHistory(){if(!S.log.length){ui.history.textContent='なし';return}ui.history.textContent=S.log.map(x=>{if(x.type==='single')return(S.parts.length?S.parts[x.target].slot+' ':'')+(x.value>0?'−':'＋')+Math.abs(x.value);if(x.type==='allDamage')return'全体 −'+x.value;if(x.type==='regen')return'ターン ＋'+x.value;if(x.type==='partyHeal')return'全体回復 ＋'+x.value;if(x.type==='revive')return x.name}).join(' → ');ui.history.scrollLeft=ui.history.scrollWidth}
function renderSkills(){ui.skills.innerHTML='';const list=S.boss?.skills||[];ui.skills.hidden=!list.length;list.forEach(sk=>{const bt=document.createElement('button');bt.textContent=sk.type==='full'?sk.name+' 全回復':sk.type==='revive'?sk.name:sk.name+' ＋'+sk.value+(sk.type==='partyHeal'?'（全体）':'');bt.onclick=()=>useSkill(sk);ui.skills.appendChild(bt)})}
function openKey(mode){S.keyMode=mode;ui.keyTitle.textContent=mode==='all'?'全体ダメージ':'手動入力';ui.keyDisplay.value='';ui.keyModal.hidden=false}function closeKey(){ui.keyModal.hidden=true}function submitKey(isHeal){const n=Math.trunc(+ui.keyDisplay.value);if(!Number.isFinite(n)||n<1||n>99999){notice('1以上の数値を入力してください');return}S.keyMode==='all'?applyAll(n):apply(isHeal?-n:n);closeKey()}
function back(){stopMic();showBattle(false)}function notice(t){ui.msg.textContent=t}
function parseNumber(t){const fw={'０':'0','１':'1','２':'2','３':'3','４':'4','５':'5','６':'6','７':'7','８':'8','９':'9'};t=t.replace(/[０-９]/g,c=>fw[c]).replace(/\s/g,'');const d=t.match(/\d{1,5}/);if(d)return +d[0];const digits={いち:1,一:1,に:2,二:2,さん:3,三:3,よん:4,四:4,ご:5,五:5,ろく:6,六:6,なな:7,七:7,はち:8,八:8,きゅう:9,九:9};let total=0,cur=0,used=false;const tokens=t.match(/さんぜん|はっせん|せん|ぜん|ろっぴゃく|はっぴゃく|さんびゃく|ひゃく|びゃく|ぴゃく|じゅう|いち|に|さん|よん|ご|ろく|なな|はち|きゅう|[一二三四五六七八九千百十]/g)||[];for(let z of tokens){used=true;if(/せん|ぜん|千/.test(z)){total+=(cur||1)*1000;cur=0}else if(/ひゃく|びゃく|ぴゃく|百/.test(z)){total+=(cur||1)*100;cur=0}else if(/じゅう|十/.test(z)){total+=(cur||1)*10;cur=0}else cur=digits[z]||cur}return used?total+cur:null}
function setupSpeech(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){ui.mic.disabled=true;ui.mic.textContent='音声認識 非対応';return}S.recognition=new SR;S.recognition.lang='ja-JP';S.recognition.continuous=true;S.recognition.interimResults=false;S.recognition.onresult=e=>handleVoice(e.results[e.results.length-1][0].transcript.trim());S.recognition.onend=()=>{if(S.listening)setTimeout(()=>{try{S.recognition.start()}catch{}},250)}}
function handleVoice(t){if(/戻|もど/.test(t))return undo();if(/リセット|りせっと/.test(t))return reset();if(/ターン|たーん/.test(t))return endTurn();const all=/全体|マダンテ|まだんて/.test(t);const slotMatch=t.match(/(?:^|\s)(A|B|C|D|エー|ビー|シー|ディー|1番|2番|3番|4番)/i);const n=parseNumber(t);if(n===null){notice('認識：'+t);return}if(all&&S.parts.length)return applyAll(n);if(slotMatch&&S.parts.length){const map={A:0,B:1,C:2,D:3,'エー':0,'ビー':1,'シー':2,'ディー':3,'1番':0,'2番':1,'3番':2,'4番':3};const k=map[slotMatch[1].toUpperCase?.()||slotMatch[1]]??map[slotMatch[1]];if(k<S.parts.length)return apply(n,k)}apply(/マイナス|回復/.test(t)?-n:n)}
function toggleMic(){if(!S.recognition)return;if(S.listening)return stopMic();S.listening=true;ui.mic.classList.add('on');ui.mic.textContent='🎙 聞き取り中…';ui.status.textContent='● MIC ON';try{S.recognition.start()}catch{}}function stopMic(){S.listening=false;ui.mic.classList.remove('on');ui.mic.textContent='🎙 音声入力 START';ui.status.textContent='READY';try{S.recognition?.stop()}catch{}}
init()})();
</script></body></html>
