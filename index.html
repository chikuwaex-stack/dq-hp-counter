<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05070b">
<title>DQ ボスHPカウンター</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}:root{--bg:#05070b;--panel:#10151d;--border:#344255;--text:#fff;--muted:#8f9bad;--green:#55f76c;--yellow:#ffd442;--red:#ff4d5d;--blue:#258cff;--heal:#4cc9ff}body{margin:0;min-height:100svh;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;overscroll-behavior:none}button,input{font:inherit}button{touch-action:manipulation}[hidden]{display:none!important}.app{width:100%;max-width:520px;min-height:100svh;margin:0 auto;padding:max(8px,env(safe-area-inset-top)) 10px max(10px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px}.header{display:flex;justify-content:space-between;align-items:center;min-height:26px}.appTitle,.status{color:var(--muted);font-size:11px}.status.active{color:#ff707e}.setup{margin-top:10px;padding:16px;background:var(--panel);border:1px solid var(--border);border-radius:16px}.setupTitle{text-align:center;font-size:21px;font-weight:900;margin-bottom:14px}.field{margin-bottom:12px}.field label{display:block;margin-bottom:6px;color:var(--muted);font-size:12px}input{width:100%;min-height:54px;padding:10px 12px;background:#080c12;color:#fff;border:1px solid #46566d;border-radius:11px;font-size:20px}.numberInput{font-size:28px;font-weight:800;text-align:center}.start{width:100%;min-height:64px;margin-top:5px;border:0;border-radius:13px;background:#2469d8;color:#fff;font-size:21px;font-weight:900}.bossArea{text-align:center}.bossName{max-width:100%;overflow:hidden;font-size:clamp(24px,7vw,34px);font-weight:900;white-space:nowrap;text-overflow:ellipsis}.hpLabel{margin-top:1px;color:var(--muted);font-size:10px;font-weight:700;letter-spacing:.22em}.hpArea{flex:1;min-height:190px;display:flex;flex-direction:column;justify-content:center;padding:5px 10px 12px;background:linear-gradient(180deg,#101822,#070b10);border:2px solid #34445a;border-radius:18px;text-align:center}.hp{font-size:clamp(110px,36vw,185px);font-weight:950;line-height:.88;font-variant-numeric:tabular-nums;color:var(--green);text-shadow:0 0 28px rgba(85,247,108,.18);transition:color .15s,transform .08s}.hp.flash{transform:scale(1.045)}.hp.warning{color:var(--yellow)}.hp.danger{color:var(--red)}.hpBarOuter{width:100%;height:11px;margin-top:14px;overflow:hidden;background:#202a35;border-radius:10px}.hpBar{width:100%;height:100%;background:var(--green);border-radius:10px;transition:width .2s,background .2s}.infoRow{display:grid;grid-template-columns:1fr 1fr;gap:7px}.infoBox{padding:7px 5px;text-align:center;background:var(--panel);border-radius:11px}.infoLabel{color:var(--muted);font-size:10px}.infoValue{display:block;margin-top:1px;font-size:22px;font-weight:900;font-variant-numeric:tabular-nums}.currentInput{min-height:64px;display:flex;justify-content:center;align-items:center;background:#151a20;border:1px solid #2b3542;border-radius:13px}.currentValue{color:var(--yellow);font-size:31px;font-weight:950}.currentValue.heal{color:var(--heal)}.mic{width:100%;min-height:78px;border:0;border-radius:16px;background:var(--blue);color:#fff;font-size:22px;font-weight:950;box-shadow:0 4px 0 #0759ad}.mic.listening{background:#df2437;box-shadow:0 4px 0 #85111b}.micDot{display:inline-block;width:10px;height:10px;margin-right:7px;background:#fff;border-radius:50%}.listening .micDot{animation:pulse .9s infinite}@keyframes pulse{50%{opacity:.25}}.controls{display:grid;grid-template-columns:1.4fr .6fr;gap:7px}.undo,.reset{min-height:58px;border:1px solid #44536a;border-radius:13px;background:#202a38;color:#fff;font-weight:800}.undo{font-size:19px}.reset{color:#ff9da5;font-size:14px}.historyArea{padding:6px 9px;background:#090d12;border-radius:9px}.historyLabel{color:#637084;font-size:9px}.history{overflow-x:auto;color:#bac5d2;font-size:13px;white-space:nowrap}.damageEntry{color:#ffbd72}.healEntry{color:var(--heal)}.message{min-height:16px;color:#ffc868;font-size:11px;text-align:center}.backSetup{align-self:center;padding:7px 14px;border:0;background:transparent;color:#667488;font-size:11px}@media(max-height:650px){.app{gap:5px}.hpArea{min-height:145px}.hp{font-size:clamp(88px,28vw,130px)}.currentInput{min-height:48px}.mic{min-height:62px}.undo,.reset{min-height:48px}}
</style></head><body><main class="app">
<header class="header"><div class="appTitle">⚔ DQ HP COUNTER</div><div id="status" class="status">READY</div></header>
<section id="setup" class="setup"><div class="setupTitle">ボス設定</div>
<div class="field"><label for="bossName">ボス名</label><input id="bossName" type="text" value="ボス" autocomplete="off"></div>
<div class="field"><label for="maxHp">最大HP</label><input id="maxHp" class="numberInput" type="number" inputmode="numeric" value="250" min="1" max="99999"></div>
<div class="field"><label for="startHp">初期HP</label><input id="startHp" class="numberInput" type="number" inputmode="numeric" value="250" min="0" max="99999"></div>
<button id="start" class="start" type="button">⚔ 戦闘開始</button></section>
<section id="battle" hidden><div class="bossArea"><div id="bossDisplay" class="bossName">ボス</div><div class="hpLabel">REMAINING HP</div></div></section>
<section id="hpArea" class="hpArea" hidden><div id="hp" class="hp" aria-live="polite">250</div><div class="hpBarOuter"><div id="hpBar" class="hpBar"></div></div></section>
<section id="infoRow" class="infoRow" hidden><div class="infoBox"><span class="infoLabel">MAX HP</span><strong id="maxDisplay" class="infoValue">250</strong></div><div class="infoBox"><span class="infoLabel">TOTAL DAMAGE</span><strong id="damage" class="infoValue">0</strong></div></section>
<section id="currentInput" class="currentInput" hidden><div id="heard" class="currentValue">---</div></section>
<button id="mic" class="mic" type="button" hidden><span class="micDot"></span><span id="micText">音声入力 START</span></button>
<section id="controls" class="controls" hidden><button id="undo" class="undo" type="button">↩ 1回戻す</button><button id="reset" class="reset" type="button">リセット</button></section>
<section id="historyArea" class="historyArea" hidden><div class="historyLabel">DAMAGE / HEAL</div><div id="history" class="history">なし</div></section>
<div id="message" class="message" aria-live="polite"></div><button id="backSetup" class="backSetup" type="button" hidden>⚙ 設定に戻る</button></main>
<script>
(()=>{const el=id=>document.getElementById(id),setupEl=el('setup'),battleEl=el('battle'),hpAreaEl=el('hpArea'),infoRowEl=el('infoRow'),currentInputEl=el('currentInput'),controlsEl=el('controls'),historyAreaEl=el('historyArea'),backSetupEl=el('backSetup'),bossNameEl=el('bossName'),maxHpEl=el('maxHp'),startHpEl=el('startHp'),bossDisplayEl=el('bossDisplay'),hpEl=el('hp'),hpBarEl=el('hpBar'),maxDisplayEl=el('maxDisplay'),damageEl=el('damage'),heardEl=el('heard'),historyEl=el('history'),messageEl=el('message'),micButton=el('mic'),micText=el('micText'),statusEl=el('status');let maxHp=250,currentHp=250,initialHp=250,history=[],listening=false,startHpManuallyEdited=false;const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let recognition=null;
maxHpEl.addEventListener('input',()=>{if(!startHpManuallyEdited){const v=Number(maxHpEl.value);if(Number.isFinite(v))startHpEl.value=Math.max(0,Math.min(99999,Math.floor(v)))}});startHpEl.addEventListener('input',()=>{startHpManuallyEdited=true});
function vibrate(p){if('vibrate'in navigator)navigator.vibrate(p)}function flash(){hpEl.classList.remove('flash');void hpEl.offsetWidth;hpEl.classList.add('flash');setTimeout(()=>hpEl.classList.remove('flash'),120)}function update(){hpEl.textContent=currentHp;maxDisplayEl.textContent=maxHp;damageEl.textContent=history.filter(v=>v>0).reduce((a,b)=>a+b,0);const r=Math.max(0,Math.min(1,currentHp/maxHp));hpBarEl.style.width=r*100+'%';hpEl.classList.remove('warning','danger');if(r<=.2){hpEl.classList.add('danger');hpBarEl.style.background='var(--red)'}else if(r<=.5){hpEl.classList.add('warning');hpBarEl.style.background='var(--yellow)'}else hpBarEl.style.background='var(--green)';historyEl.innerHTML=history.length?history.map(v=>v<0?'<span class="healEntry">'+v+'</span>':'<span class="damageEntry">'+v+'</span>').join(' → '):'なし'}
function speak(t){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ja-JP';u.rate=1.4;speechSynthesis.speak(u)}function apply(v){if(!Number.isFinite(v)||v===0||Math.abs(v)>9999)return;if(v<0){history.push(v);currentHp=Math.min(maxHp,currentHp+Math.abs(v));heardEl.classList.add('heal');heardEl.textContent='＋'+Math.abs(v)+' HP';messageEl.textContent='回復'}else{history.push(v);currentHp=Math.max(0,currentHp-v);heardEl.classList.remove('heal');heardEl.textContent='−'+v;messageEl.textContent='DAMAGE'}flash();update();if(currentHp===0){messageEl.textContent='撃破！';speak('撃破')}else if(v>0&&currentHp<=maxHp*.2)speak('残り '+currentHp)}function undo(){if(!history.length){messageEl.textContent='戻せる入力なし';return}const v=history.pop();currentHp=v>0?Math.min(maxHp,currentHp+v):Math.max(0,currentHp-Math.abs(v));heardEl.textContent='↩ '+Math.abs(v);flash();update()}function resetBattle(){currentHp=initialHp;history=[];heardEl.textContent='---';messageEl.textContent='初期HPへリセット';update()}
function showBattle(on){setupEl.hidden=on;[battleEl,hpAreaEl,infoRowEl,currentInputEl,micButton,controlsEl,historyAreaEl,backSetupEl].forEach(x=>x.hidden=!on)}function startBattle(){let max=Math.floor(Number(maxHpEl.value)),start=Math.floor(Number(startHpEl.value));if(!Number.isFinite(max)||max<1||max>99999){messageEl.textContent='最大HPは1〜99999で入力してください';return}if(!Number.isFinite(start)||start<0){messageEl.textContent='初期HPを入力してください';return}start=Math.min(max,start);maxHpEl.value=max;startHpEl.value=start;maxHp=max;initialHp=start;currentHp=start;history=[];bossDisplayEl.textContent=bossNameEl.value.trim()||'ボス';heardEl.textContent='---';messageEl.textContent='戦闘開始';showBattle(true);update()}
function stop(){if(!listening)return;listening=false;micButton.classList.remove('listening');micText.textContent='音声入力 START';statusEl.textContent='READY';statusEl.classList.remove('active');try{recognition&&recognition.stop()}catch(_){}}function back(){stop();showBattle(false);messageEl.textContent='設定変更'}function parse(t){const c={'０':'0','１':'1','２':'2','３':'3','４':'4','５':'5','６':'6','７':'7','８':'8','９':'9','－':'-','−':'-'};t=t.replace(/[０-９－−]/g,x=>c[x]).replace(/マイナス|まいなす/g,'-').replace(/minus/gi,'-').replace(/[,，\s]/g,'');const m=t.match(/-?\d{1,4}/);return m?Number(m[0]):null}
if(SR){recognition=new SR();recognition.lang='ja-JP';recognition.continuous=true;recognition.interimResults=false;recognition.addEventListener('result',e=>{const t=e.results[e.results.length-1][0].transcript.trim();if(/戻|もど/.test(t))return undo();if(/リセット|りせっと/.test(t))return resetBattle();const v=parse(t);if(v!==null)apply(v);else messageEl.textContent='認識: '+t});recognition.addEventListener('end',()=>{if(listening)setTimeout(()=>{try{recognition.start()}catch(_){}},300)})}else{micButton.disabled=true;micText.textContent='音声認識 非対応'}
micButton.addEventListener('click',()=>{if(!recognition)return;if(listening){stop();return}listening=true;micButton.classList.add('listening');micText.textContent='聞き取り中…';statusEl.textContent='● MIC ON';statusEl.classList.add('active');try{recognition.start()}catch(_){}});el('start').addEventListener('click',startBattle);el('undo').addEventListener('click',undo);el('reset').addEventListener('click',resetBattle);backSetupEl.addEventListener('click',back);update()})();
</script></body></html>
